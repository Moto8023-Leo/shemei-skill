name: Export Static Data

on:
  schedule:
    # Every hour
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Fetch live API data
        run: |
          mkdir -p data
          for ep in health bootstrap brands "models?brand=ienyrid" "events?country=GB" "events?country=DE" "events?country=FR" "events?country=ES" "events?country=IT" "events?country=NL" "events?country=BE" "visual/style-pool?language=zh"; do
            fname=$(echo "$ep" | cut -d'?' -f1 | tr '/' '_').json
            curl -sS --connect-timeout 30 "https://shemei-skill.vercel.app/api/$ep" \
              -o "data/$fname" && echo "OK $fname" || echo "FAIL $ep"
          done

      - name: Commit & push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: auto-refresh $(date -u +%Y-%m-%d)"
            git push origin gh-pages
          fi
